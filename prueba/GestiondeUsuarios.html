<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="GestiondeUsuarios.css">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase/config.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="usuarios-panel">
        <button id="btn-volver-admin" class="volver-admin-btn"><i class='bx bx-arrow-back'></i> Volver al Panel Principal</button>
        <h2>Gestión de Usuarios</h2>
        <table class="usuarios-table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="usuarios-lista">
                <tr><td colspan="4" style="text-align:center; color:#aaa;">Cargando usuarios...</td></tr>
            </tbody>
        </table>
        <!-- Modal de edición de usuario -->
        <div id="modal-editar-usuario" class="modal-usuario" style="display:none;">
            <div class="modal-usuario-content">
                <span id="cerrar-modal-usuario" class="cerrar-modal-usuario">&times;</span>
                <h3>Editar Usuario</h3>
                <form id="form-editar-usuario">
                    <input type="hidden" id="edit-usuario-id">
                    <div class="form-group">
                        <label for="edit-usuario-nombre">Nombre:</label>
                        <input type="text" id="edit-usuario-nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-usuario-email">Email:</label>
                        <input type="email" id="edit-usuario-email" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-usuario-rol">Rol:</label>
                        <select id="edit-usuario-rol">
                            <option value="Cliente">Cliente</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-guardar-cambios">Guardar Cambios</button>
                </form>
            </div>
        </div>
    </div>
    <script src="GestiondeUsuarios.js"></script>
    <script>
    // Navegación de regreso al panel admin
    document.getElementById('btn-volver-admin').onclick = function() {
        window.location.href = 'Administrador.html';
    };
    </script>
</body>
</html>
