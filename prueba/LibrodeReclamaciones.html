
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Libro de Reclamaciones</title>
	<link rel="stylesheet" href="LibrodeReclamaciones.css">
</head>
<body>
	<div class="libro-container">
		<h1>Libro de Reclamaciones</h1>
		<form id="form-reclamacion">
			<fieldset>
				<legend>Datos del Cliente</legend>
				<label for="nombre">Nombre completo *</label>
				<input type="text" id="nombre" name="nombre" required>

				<label for="dni">DNI *</label>
				<input type="text" id="dni" name="dni" maxlength="8" pattern="[0-9]{8}" required>

				<label for="email">Correo electrónico *</label>
				<input type="email" id="email" name="email" required>

				<label for="telefono">Teléfono</label>
				<input type="tel" id="telefono" name="telefono" maxlength="9" pattern="[0-9]{9}">
			</fieldset>

			<fieldset>
				<legend>Detalle de la Reclamación</legend>
				<label for="tipo">Tipo *</label>
				<select id="tipo" name="tipo" required>
					<option value="">Seleccione</option>
					<option value="queja">Queja</option>
					<option value="reclamo">Reclamo</option>
				</select>

				<label for="producto">Producto o servicio *</label>
				<input type="text" id="producto" name="producto" required>

				<label for="detalle">Detalle *</label>
				<textarea id="detalle" name="detalle" rows="4" required></textarea>
			</fieldset>

			<fieldset>
				<legend>Pedido del Cliente *</legend>
				<textarea id="pedido" name="pedido" rows="3" required></textarea>
			</fieldset>

			<button type="submit">Enviar Reclamación</button>
			<p id="mensaje-exito" style="display:none;color:green;margin-top:10px;">¡Reclamación enviada correctamente!</p>
		</form>
	</div>
	<script src="LibrodeReclamaciones.js"></script>
</body>
</html>
