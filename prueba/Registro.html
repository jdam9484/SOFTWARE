<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos básicos para el formulario de registro */
        .registro-container {
            max-width: 400px;
            margin: 60px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.12);
            padding: 32px 24px 24px 24px;
        }
        .registro-container h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #88002b;
        }
        .registro-container label {
            display: block;
            margin-bottom: 6px;
            color: #333;
        }
        .registro-container input, .registro-container select {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .registro-container button {
            width: 100%;
            background: #88002b;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        .registro-container .mensaje {
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="registro-container">
        <h2>Registro de Usuario</h2>
        <form id="formRegistro">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>



            <button type="submit">Registrarse</button>
        </form>
        <div class="mensaje" id="mensaje"></div>
        <p style="text-align:center; margin-top:16px;">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
    </div>
    <!-- Firebase App (core) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Tu configuración -->
    <script src="firebase/config.js"></script>
    <script type="module" src="./Registro.js"></script>
</body>
</html>
